<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Abuela</title>
<meta name="description" content="Tú eres la abuela. Tu trabajo es no colgar.">
<meta property="og:title" content="La Abuela">
<meta property="og:description" content="Tú eres la abuela. Tu trabajo es no colgar.">
<meta property="og:image" content="art/abuela.png">
<link rel="icon" href="art/abuela.png">
<meta name="theme-color" content="#0e0b12">
<style>
  :root { --neon: #ff5c8a; --amber: #f2b34c; --bg: #0e0b12; --panel: #1a141f; --ink: #f5f0f6; --muted: #9a8fa3; --good: #7fd48a; --bad: #e0574f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; min-height: 100%; }
  body { display: flex; justify-content: center; }
  :root { --side: min(100vw, 430px); }
  #app { width: var(--side); min-height: 100dvh; display: flex; flex-direction: column; position: relative; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  /* ---------- title ---------- */
  #title { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; gap: 18px;
    background: radial-gradient(ellipse at 50% 30%, #2a1a2c 0%, var(--bg) 70%); }
  #title h1 { font-family: 'IBM Plex Mono', monospace; font-size: clamp(40px, 12vw, 72px); letter-spacing: 6px; color: var(--neon); margin: 0; text-shadow: 0 0 24px rgba(255,92,138,.45); }
  #title p { color: var(--amber); font-size: 18px; margin: 0; }
  #langs { display: flex; gap: 8px; }
  #langs button { background: transparent; border: 1px solid var(--muted); color: var(--muted); border-radius: 8px; padding: 6px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer; }
  #langs button.on { border-color: var(--neon); color: var(--neon); }
  #title .how { color: var(--muted); font-size: 14px; max-width: 320px; line-height: 1.45; }
  .duo { display: flex; align-items: center; }
  .duo img { width: 150px; border-radius: 50%; border: 3px solid var(--neon); box-shadow: 0 0 30px rgba(255,92,138,.3); object-fit: cover; aspect-ratio: 1; object-position: 50% 22%; background: #000; }
  .duo img.est { border-color: var(--muted); filter: saturate(.7); width: 130px; }
  .duo .vs { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 22px; color: var(--amber); background: var(--bg); border: 3px solid var(--neon); border-radius: 50%; width: 52px; height: 52px; display: inline-flex; align-items: center; justify-content: center; margin: 0 -14px; position: relative; z-index: 2; box-shadow: 0 0 16px rgba(255,92,138,.4); }
  .btn { background: var(--neon); color: #1a0a10; border: 0; border-radius: 10px; padding: 14px 28px; font-size: 18px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--muted); }
  .ring { animation: ring .9s ease-in-out infinite; }
  @keyframes ring { 0%,100% { transform: rotate(0) } 20% { transform: rotate(-6deg) } 40% { transform: rotate(6deg) } 60% { transform: rotate(-4deg) } 80% { transform: rotate(4deg) } }

  /* ---------- call ---------- */
  #call { flex: 1; display: none; flex-direction: column; }
  #hud { display: flex; gap: 10px; padding: 10px 14px 6px; font-size: 12px; color: var(--muted); }
  .meter { flex: 1; }
  .meter b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 4px; font-size: 12px; }
  .bar { height: 8px; background: #2a2230; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; transition: width .5s; border-radius: 4px; }
  #pat i { background: var(--good); } #sus i { background: var(--bad); }
  #clock { text-align: right; min-width: 64px; }
  #clock b { font-size: 18px; color: var(--amber); }
  #clues { display: flex; gap: 6px; padding: 0 14px 6px; min-height: 22px; flex-wrap: wrap; }
  .clue { font-size: 11px; background: #2a2230; color: var(--amber); border: 1px solid var(--amber); border-radius: 12px; padding: 2px 8px; }
  #stage { position: relative; height: var(--side); overflow: hidden; background: #000; }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s, filter .6s; }
  #stage video.on { opacity: 1; }
  /* the same man, a little different in each role: warm and close as the 'grandson', cold and formal as the 'lawyer' */
  #stage.look-nieto #v-est { filter: saturate(1.15) brightness(1.05); }
  #stage.look-abogado #v-est { filter: saturate(.55) contrast(1.15) brightness(.9) hue-rotate(-12deg); }
  #stage::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,11,18,0) 62%, rgba(14,11,18,.9) 100%); pointer-events: none; }
  #bubble { margin: calc(var(--side) * -0.3) 12px 0; position: relative; z-index: 2; background: rgba(14,11,18,.74); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 10px 14px 12px; font-size: 19px; font-weight: 600; line-height: 1.35; min-height: 72px; text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.8); }
  #bubble .w { transition: color .08s; }
  #bubble .w.on { color: var(--amber); }
  #bubble .w.done { color: #cfc6d6; }
  #bubble.abuela { border-left: 5px solid var(--amber); }
  #bubble.est { border-left: 5px solid var(--neon); }
  #bubble::before { content: attr(data-who); display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-bottom: 4px; }
  #bubble.est::before { color: var(--neon); } #bubble.abuela::before { color: var(--amber); }
  #bubble.est.more::after { content: '▸'; position: absolute; right: 12px; bottom: 6px; color: var(--muted); font-size: 14px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2 } }
  #cards { padding: 10px 14px 16px; display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  #cards::before { content: attr(data-label); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--amber); padding: 2px 0 2px; }
  .card { background: #2b2233; border: 1px solid #4a3b55; border-radius: 12px; padding: 11px 12px; text-align: left; color: var(--ink); font-size: 15px; line-height: 1.35; cursor: pointer; font-family: inherit; display: flex; gap: 10px; align-items: flex-start; }
  .card:hover { border-color: var(--amber); }
  .card:active { transform: scale(.985); }
  .card small { color: #1a1008; background: var(--amber); font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; min-width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .card:disabled { opacity: .35; cursor: default; }
  .btn.next { align-self: center; padding: 12px 36px; }
  .btn.donate { background: var(--amber); color: #1a1008; text-decoration: none; display: inline-block; }
  .donate-small { color: var(--amber); font-size: 14px; text-decoration: none; border-bottom: 1px dotted var(--amber); }
  .hint { color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 4px; }
  .gear { background: none; border: 1px solid var(--muted); border-radius: 6px; color: var(--ink); font-size: 16px; line-height: 1; padding: 4px 8px; cursor: pointer; align-self: flex-start; }
  .gear:hover, .gear.open { border-color: var(--amber); color: var(--amber); }
  .title-gear { position: absolute; top: 12px; right: 12px; }
  #menu { position: fixed; top: 52px; right: max(8px, calc((100vw - var(--side)) / 2 + 8px)); z-index: 40; width: min(340px, calc(100vw - 24px)); background: #1a141f; border: 1px solid #3a2f42; border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 12px; }
  #menu[hidden] { display: none; }
  .set-row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-family: 'IBM Plex Mono', monospace; }
  .set-row > span:first-child { width: 100%; color: var(--muted); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  .set-langs button, .opt { background: none; border: 1px solid var(--muted); border-radius: 6px; color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 5px 10px; cursor: pointer; text-decoration: none; }
  .set-langs button.on { border-color: var(--neon); color: var(--neon); }
  .opt { opacity: .5; } .opt.on, .set-actions .opt { opacity: 1; }
  .opt.on { border-color: var(--amber); }
  #help { position: fixed; inset: 0; z-index: 60; background: rgba(14,11,18,.92); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #help[hidden] { display: none; }
  .help-box { width: min(440px, 100%); max-height: 90dvh; overflow-y: auto; background: var(--panel); border: 1px solid #3a2f42; border-radius: 14px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .help-box h3 { margin: 0; font-family: 'IBM Plex Mono', monospace; letter-spacing: 3px; color: var(--neon); font-size: 16px; }
  .help-box p { margin: 0; line-height: 1.45; font-size: 15px; }
  .help-box b { color: var(--amber); }
  .help-box .btn { align-self: center; margin-top: 4px; }
  .help-box .support { color: var(--muted); font-size: 14px; line-height: 1.45; border-top: 1px solid #3a2f42; padding-top: 12px; margin: 4px 0 0; }
  #end .tip { color: var(--ink); font-size: 14px; background: #221a28; border-left: 4px solid var(--amber); border-radius: 8px; padding: 8px 12px; max-width: 360px; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: var(--amber); color: #1a1008; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9; }
  #toast.on { opacity: 1; }

  /* ---------- ending ---------- */
  #end { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 18px; gap: 14px; }
  #end img { width: 120px; aspect-ratio: 1; object-fit: cover; object-position: 50% 25%; border-radius: 50%; border: 3px solid var(--neon); }
  #end img.bad { border-color: var(--bad); filter: grayscale(.6); }
  #end h2 { font-family: 'IBM Plex Mono', monospace; letter-spacing: 3px; color: var(--neon); margin: 0; font-size: 22px; }
  #end h2.bad { color: var(--bad); }
  #end .big { font-size: 44px; color: var(--amber); font-family: 'IBM Plex Mono', monospace; margin: 0; }
  #end p { margin: 0; line-height: 1.45; max-width: 360px; }
  #end .muted { color: var(--muted); font-size: 14px; }
  #end .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  footer { color: var(--muted); font-size: 11px; text-align: center; padding: 10px; font-family: 'IBM Plex Mono', monospace; }
  /* phones: a shorter portrait so the three cards fit without scrolling */
  @media (max-height: 900px) {
    #bubble { font-size: 17px; padding: 8px 12px 10px; min-height: 64px; }
    .card { padding: 10px 12px; font-size: 14.5px; }
    #cards { gap: 6px; padding-bottom: 10px; }
  }
  @media (max-width: 420px) { #title h1 { letter-spacing: 3px; font-size: 44px; } }
</style>
</head>
<body>
<div id="app">
  <section id="title">
    <button class="gear title-gear" data-gear title="Menu">⚙</button>
    <div class="duo"><img src="art/estafador.png" alt="" class="est"><span class="vs">VS</span><img src="art/abuela.png" alt=""></div>
    <h1>LA ABUELA</h1>
    <p data-t="slogan"></p>
    <div class="how" data-t="how"></div>
    <button class="btn ring" id="answer"></button>
    <div class="how" id="best"></div>
    <div id="langs"><button data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="uk">UK</button></div>
    <a class="donate-small" id="donate2" href="https://tinylobby.itch.io/la-abuela/donate" target="_blank" rel="noopener"></a>
    <footer>Tiny Lobby</footer>
  </section>

  <section id="call">
    <div id="hud">
      <div class="meter" id="pat"><b data-t="patience"></b><div class="bar"><i></i></div></div>
      <div class="meter" id="sus"><b data-t="suspicion"></b><div class="bar"><i></i></div></div>
      <div id="clock"><b class="mono">0:00</b><br><span data-t="stolen"></span></div>
      <button class="gear" data-gear title="Menu">⚙</button>
    </div>
    <div id="clues"></div>
    <div id="stage">
      <video id="v-est" src="art/estafador_talk.mp4" muted loop playsinline preload="auto"></video>
      <video id="v-abu" src="art/abuela_talk.mp4" muted loop playsinline preload="auto"></video>
      <video id="v-jefe" src="art/jefe_talk.mp4" muted loop playsinline preload="auto"></video>
    </div>
    <div id="bubble"></div>
    <div id="cards"></div>
  </section>

  <section id="end">
    <img id="end-img" src="art/abuela.png" alt="">
    <h2 id="end-title"></h2>
    <p class="big mono" id="end-time"></p>
    <p id="end-text"></p>
    <p class="muted" id="end-clues"></p>
    <p class="tip" id="end-tip"></p>
    <p class="muted" id="end-attempt"></p>
    <div class="row">
      <button class="btn" id="again"></button>
      <button class="btn ghost" id="share"></button>
    </div>
    <a class="btn donate" id="donate" href="https://tinylobby.itch.io/la-abuela/donate" target="_blank" rel="noopener"></a>
    <footer>La Abuela · Tiny Lobby</footer>
  </section>
  <div id="menu" hidden>
    <div class="set-row"><span data-t="mLang"></span><span class="set-langs"><button data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="uk">UK</button></span></div>
    <div class="set-row"><span data-t="mSound"></span>
      <button id="opt-voice" class="opt">🔊 <small data-t="mVoices"></small></button>
      <button id="opt-sfx" class="opt">📞 <small data-t="mSfx"></small></button></div>
    <div class="set-row set-actions">
      <button id="m-help" class="opt on">❓ <small data-t="mHelp"></small></button>
      <button id="m-home" class="opt">⌂ <small data-t="mHome"></small></button>
      <a class="opt" id="m-donate" href="https://tinylobby.itch.io/la-abuela/donate" target="_blank" rel="noopener">💶 <small data-t="mDonate"></small></a>
      <button id="m-share" class="opt">↗ <small data-t="share"></small></button></div>
  </div>
  <div id="help" hidden><div class="help-box"><h3 data-t="mHelp"></h3><div id="help-text"></div><p class="support" data-t="helpSupport"></p><a class="btn donate" id="donate3" href="https://tinylobby.itch.io/la-abuela/donate" target="_blank" rel="noopener"></a><button class="btn ghost" id="help-close"></button></div></div>
  <div id="toast"></div>
</div>

<script>
// La Abuela — prototype of one call (25.10.2026). One scammer, three kinds of cards, two meters.
// A card: { k: 'd'|'p'|'f'|'t' (stall / ask back / fake data / trap), text, pat, sus, time (seconds), clue, react }
// The trap looks like the other cards. Choosing it gives the scammer something real and ends the call.
// 25.10: three languages (Natalia does not read Spanish). Every string is {es, en, uk}; T() picks the current one.
const LANGS = ['es', 'en', 'uk'];
let LANG = new URLSearchParams(location.search).get('lang') || localStorage.getItem('abuela_lang') || (navigator.language || 'es').slice(0, 2);
if (!LANGS.includes(LANG)) LANG = 'es';
const T = (o) => typeof o === 'string' ? o : (o[LANG] ?? o.es);

const UI = {
  slogan: { es: 'Tu trabajo es no colgar.', en: 'Your job is not to hang up.', uk: 'Твоя робота — не класти слухавку.' },
  how: { es: 'Te llama un estafador. No le des nada de verdad. Cada minuto que pierde contigo es un minuto que no roba a nadie.',
         en: 'A scammer is calling. Give him nothing real. Every minute he wastes on you is a minute he is not robbing anyone.',
         uk: 'Тобі дзвонить шахрай. Не давай йому нічого справжнього. Кожна хвилина, яку він витрачає на тебе, — хвилина, коли він нікого не грабує.' },
  answer: { es: '📞 Contestar', en: '📞 Answer', uk: '📞 Відповісти' },
  donate: { es: '💶 Añadir algo a la pensión de la abuela', en: '💶 Top up Grandma’s pension', uk: '💶 Докинути бабусі до пенсії' },
  patience: { es: 'Paciencia del estafador', en: "Scammer's patience", uk: 'Терпіння шахрая' },
  suspicion: { es: 'Sospecha', en: 'Suspicion', uk: 'Підозра' },
  stolen: { es: 'robado', en: 'stolen', uk: 'вкрадено' },
  abuela: { es: 'LA ABUELA', en: 'GRANDMA', uk: 'БАБУСЯ' }, est: { es: 'EL ESTAFADOR', en: 'THE SCAMMER', uk: 'ШАХРАЙ' }, jefe: { es: 'EL JEFE', en: 'THE BOSS', uk: 'БОС' },
  best: { es: 'Tu récord', en: 'Your best', uk: 'Твій рекорд' }, manoloN: { es: 'veces Manolo', en: 'times Manolo', uk: 'разів Маноло' },
  yourAnswer: { es: 'TU RESPUESTA', en: 'YOUR ANSWER', uk: 'ТВОЯ ВІДПОВІДЬ' },
  mLang: { es: 'Idioma', en: 'Language', uk: 'Мова' }, mSound: { es: 'Sonido', en: 'Sound', uk: 'Звук' }, mVoices: { es: 'Voces', en: 'Voices', uk: 'Голоси' }, mSfx: { es: 'Teléfono', en: 'Phone sounds', uk: 'Телефон' },
  mHome: { es: 'Al inicio', en: 'To title', uk: 'На заставку' }, mDonate: { es: 'Apoyar', en: 'Support', uk: 'Підтримати' },
  mHelp: { es: 'Cómo se juega', en: 'How to play', uk: 'Як грати' },
  helpClose: { es: 'Entendido', en: 'Got it', uk: 'Зрозуміло' },
  help: {
    es: `<p><b>Qué hacer.</b> Te llama un estafador. Tu trabajo es <b>no colgar</b> y <b>no darle nada de verdad</b>. Cada respuesta es una carta: una para ganar tiempo, una para preguntarle algo, una para darle datos falsos. A veces aparece una cuarta: datos reales. Esa es la trampa.</p>
<p><b>Paciencia del estafador.</b> Baja cuando le haces perder el tiempo. Si llega a cero, cuelga él. Eso es una victoria.</p>
<p><b>Sospecha.</b> Sube cuando preguntas demasiado. Si se llena, se da cuenta de que juegas con él y cuelga sin dejar pistas.</p>
<p><b>Tiempo robado.</b> Tu puntuación: cada minuto que pierde contigo es un minuto que no roba a nadie.</p>
<p><b>Pistas.</b> Preguntando bien le sacas tres cosas: la cuenta, la ciudad y el nombre. Con las tres aparece la carta de <b>Manolo</b>, tu nieto guardia civil. Es el mejor final.</p>
<p><b>Finales:</b> cuelga él · te descubre · Manolo se pone · le diste algo de verdad (pierdes 2000 €).</p>`,
    en: `<p><b>What to do.</b> A scammer is calling. Your job is to <b>never hang up</b> and <b>never give him anything real</b>. Every answer is a card: one stalls, one asks him something, one feeds him fake data. Sometimes a fourth appears: real data. That's the trap.</p>
<p><b>Scammer's patience.</b> Drops as you waste his time. At zero he hangs up. That's a win.</p>
<p><b>Suspicion.</b> Rises when you ask too much. If it fills up, he realises you're playing him and hangs up without leaving clues.</p>
<p><b>Stolen time.</b> Your score: every minute he wastes on you is a minute he isn't robbing anyone.</p>
<p><b>Clues.</b> Ask the right questions and he lets slip three things: the account, the city and the name. With all three the <b>Manolo</b> card appears, your police-officer grandson. That's the best ending.</p>
<p><b>Endings:</b> he hangs up · he sees through you · Manolo picks up · you gave him something real (you lose €2000).</p>`,
    uk: `<p><b>Що робити.</b> Тобі дзвонить шахрай. Твоя робота — <b>не класти слухавку</b> і <b>не давати йому нічого справжнього</b>. Кожна відповідь — картка: одна тягне час, одна ставить йому запитання, одна підсовує фальшиві дані. Іноді з'являється четверта — справжні дані. Це пастка.</p>
<p><b>Терпіння шахрая.</b> Падає, коли ти марнуєш його час. На нулі він кладе слухавку — це перемога.</p>
<p><b>Підозра.</b> Росте, коли ти забагато питаєш. Якщо заповниться — він розуміє, що ти з ним граєш, і кладе слухавку, не лишивши підказок.</p>
<p><b>Вкрадений час.</b> Твій рахунок: кожна хвилина, яку він витратив на тебе, — хвилина, коли він нікого не пограбував.</p>
<p><b>Підказки.</b> Правильними запитаннями витягаєш три речі: рахунок, місто та ім'я. З усіма трьома з'являється картка <b>Маноло</b> — твого онука-поліцейського. Це найкраща кінцівка.</p>
<p><b>Кінцівки:</b> він поклав слухавку · він тебе розкусив · Маноло бере слухавку · ти дала йому справжнє (мінус 2000 €).</p>`,
  },

$('opt-sfx').onclick = () => { SFX_ON = !SFX_ON; localStorage.setItem('abuela_sfx', SFX_ON ? '1' : '0'); if (!SFX_ON) ringStop(); applyLang(); };
$('m-home').onclick = () => { menuToggle(false); if (voCur) { voCur.pause(); voCur = null; } lipsOff(); S = S || fresh(); S.busy = true; $('call').style.display = 'none'; $('end').style.display = 'none'; $('title').style.display = 'flex'; applyLang(); };
$('m-share').onclick = () => { menuToggle(false); $('share').click(); };
$('m-help').onclick = () => { menuToggle(false); $('help').hidden = false; };
$('help-close').onclick = () => { $('help').hidden = true; };
$('share').onclick = async () => {   // 25.10 Natalia: send friends the game link, not the result (also used from the menu)
  const url = 'https://tinylobby.itch.io/la-abuela';   // 26.10 Natalia: sharing always points at the itch page
  const txt = 'La Abuela 👵📞 ' + T(UI.slogan);
  // phone: the system share sheet (WhatsApp, Telegram…); desktop: the link goes to the clipboard
  if (navigator.share) { try { await navigator.share({ title: 'La Abuela', text: txt, url }); return; } catch {} }
  try { await navigator.clipboard.writeText(url); toast(T(UI.copied)); } catch { toast(url); }
};
document.addEventListener('keydown', (e) => {
  if ($('call').style.display !== 'flex' || S.busy) return;
  const n = +e.key; const bs = $('cards').querySelectorAll('button');
  if (n >= 1 && n <= bs.length) bs[n - 1].click();
});
applyLang();
if (new URLSearchParams(location.search).has('start')) start();   // ?start opens straight on the call (screenshots, tests)
{ const w = +new URLSearchParams(location.search).get('w'); if (w) $('app').style.width = w + 'px'; }   // ?w=390 previews a phone width on a desktop
</script>
</body>
</html>
